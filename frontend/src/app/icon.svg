<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .glyph { stroke: #09090b; fill: none; }
    .glyph-fill { fill: #09090b; }
    .accent { stroke: #f59e0b; fill: #f59e0b; }
    @media (prefers-color-scheme: dark) {
      .glyph { stroke: #f4f4f5; }
      .glyph-fill { fill: #f4f4f5; }
      .accent { stroke: #fbbf24; fill: #fbbf24; }
    }
  </style>

  <!-- Letter Q Main Body -->
  <circle cx="30" cy="30" r="18" class="glyph" stroke-width="4.5" />

  <!-- Single Archery Arrow Piercing Diagonally Through the Q -->
  <!-- Arrow Shaft -->
  <line x1="8" y1="52" x2="52" y2="12" class="accent" stroke-width="3.5" stroke-linecap="round" />

  <!-- Arrow Fletching (Feathers at lower-left) -->
  <path d="M 12 56 L 6 54 L 10 46 L 16 48 Z" class="glyph-fill" />
  <path d="M 18 58 L 12 56 L 16 50 L 22 52 Z" class="glyph-fill" />

  <!-- Arrow Tip (Pointed at top-right) -->
  <polygon points="56,8 44,12 48,16" class="glyph-fill" />

  <!-- Q Serif Loop Tail -->
  <path d="M 36 38 C 42 44, 48 50, 56 48 C 50 44, 46 40, 42 36" class="glyph" stroke-width="4" stroke-linecap="round" />
</svg>
